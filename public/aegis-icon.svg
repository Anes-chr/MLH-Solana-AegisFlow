<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="aegisShieldGrad" x1="32" y1="24" x2="224" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="40%" stop-color="#6928EA"/>
      <stop offset="100%" stop-color="#4318FF"/>
    </linearGradient>
    <linearGradient id="coreLight" x1="128" y1="64" x2="128" y2="192" gradientUnits="userSpaceOnUse">
