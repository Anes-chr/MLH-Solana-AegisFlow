  <!-- App Icon Base -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="254" height="254" rx="55" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <rect x="2" y="2" width="252" height="252" rx="54" stroke="rgba(139,92,246,0.22)" stroke-width="1.5"/>

  <!-- Radiant Aura -->
  <circle cx="128" cy="120" r="88" fill="url(#subtleAura)"/>

  <!-- Sovereign Aegis Shield Outer Contour -->
